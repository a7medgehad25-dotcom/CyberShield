<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield Admin Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e293b;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #0f172a;
            color: white;
            padding: 25px 18px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
        }

        .logo span {
            color: #38bdf8;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 12px;
        }

        .menu a {
            display: block;
            padding: 13px 15px;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 8px;
        }

        .menu a:hover,
        .menu a.active {
            background: #1e293b;
            color: white;
        }

        .main {
            margin-left: 240px;
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .topbar h1 {
            font-size: 28px;
        }

        .admin-badge {
            background: #e0f2fe;
            color: #0369a1;
            padding: 10px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
        }

        .card h3 {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .card .number {
            font-size: 30px;
            font-weight: bold;
        }

        .users-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
        }

        .users-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .users-header h2 {
            font-size: 21px;
        }

        .refresh-btn {
            border: none;
            background: #0f172a;
            color: white;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
        }

        .refresh-btn:hover {
            background: #1e293b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f8fafc;
            color: #475569;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 13px;
            background: #dcfce7;
            color: #166534;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #64748b;
        }

        @media (max-width: 900px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main {
                margin-left: 0;
                padding: 20px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .topbar {
                gap: 15px;
                align-items: flex-start;
                flex-direction: column;
            }

            table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <div class="logo">
            Cyber<span>Shield</span>
        </div>

        <ul class="menu">
            <li>
                <a href="#" class="active">Dashboard</a>
            </li>
            <li>
                <a href="#">Users</a>
            </li>
            <li>
                <a href="#">Courses</a>
            </li>
            <li>
                <a href="#">Security Logs</a>
            </li>
            <li>
                <a href="index.html">Back to Website</a>
            </li>
        </ul>
    </aside>

    <main class="main">

        <div class="topbar">
            <h1>Admin Dashboard</h1>
            <div class="admin-badge">
                Administrator
            </div>
        </div>

        <section class="cards">

            <div class="card">
                <h3>Total Users</h3>
                <div class="number" id="totalUsers">0</div>
            </div>

            <div class="card">
                <h3>Verified Users</h3>
                <div class="number" id="verifiedUsers">0</div>
            </div>

            <div class="card">
                <h3>Courses</h3>
                <div class="number">6</div>
            </div>

            <div class="card">
                <h3>System Status</h3>
                <div class="number">Online</div>
            </div>

        </section>

        <section class="users-section">

            <div class="users-header">
                <h2>Registered Users</h2>

                <button class="refresh-btn" onclick="loadUsers()">
                    Refresh
                </button>
            </div>

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Email</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="usersTable">

                    <tr>
                        <td colspan="3" class="empty">
                            No users registered yet.
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>

    </main>

    <script>
async function loadUsers() {
    try {
        const response = await fetch("/users");
        const data = await response.json();

        const usersTable = document.getElementById("usersTable");
        const totalUsers = document.getElementById("totalUsers");
        const verifiedUsers = document.getElementById("verifiedUsers");

        totalUsers.textContent = data.users.length;

        verifiedUsers.textContent =
            data.users.filter(user => user.status === "Verified").length;

        if (data.users.length === 0) {
            usersTable.innerHTML =
                '<tr><td colspan="3">No users registered yet.</td></tr>';
            return;
        }

        usersTable.innerHTML = data.users.map((user, index) => `
            <tr>
                <td>${index + 1}</td>
                <td>${user.phone}</td>
                <td>${user.status}</td>
            </tr>
        `).join("");

    } catch (error) {
        console.error("Error loading users:", error);
    }
}

loadUsers();
        
    </script>

</body>
</html>
